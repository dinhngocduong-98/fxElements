services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: framevault
      MYSQL_USER: framevault
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/framevault?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USER: framevault
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8088}
      STORAGE_ROOT: /storage
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-no-reply@framevault.local}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_TLS: ${MAIL_TLS:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      - media_data:/storage
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
  frontend:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"
volumes:
  mysql_data:
  media_data:
