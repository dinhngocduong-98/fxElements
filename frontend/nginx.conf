server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 # Login return URLs may contain an encoded fragment token.
 access_log off;
 index index.html;
 client_max_body_size 2050m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ {
  proxy_pass http://backend:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_request_buffering off;
  # Never log private download tokens.
  access_log off;
 }
 location / { try_files $uri $uri/ /index.html; }
}
